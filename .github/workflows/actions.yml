name: Rust

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
        persist-credentials: false

    - name: Cache Rust
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        cache-on-failure: true

    - name: Restore Swift build cache
      id: swift-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: server-swift/.build
        key: ${{ runner.os }}-swift-6.3.2-${{ hashFiles('server-swift/Package.swift', 'server-swift/Package.resolved', 'server-swift/patches/*.patch') }}

    - name: Install Swift
      uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # main
      with:
        swift-version: swift-6.3.2-release
        swift-build: 6.3.2-RELEASE

    - name: Install Protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        repo-token: ${{ github.token }}

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22

    - name: Install x86 Rust target
      run: rustup target add i686-pc-windows-msvc

    - name: Install Inno Setup
      run: choco install innosetup --yes --no-progress

    - name: Install cargo-make
      run: |
        if (!(Get-Command cargo-make -ErrorAction SilentlyContinue)) {
          cargo install --locked cargo-make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Download prebuilt llama
      run: |
        function Download-Extract {
          param (
            [string]$url,
            [string]$destFolder
          )
          $tempZip = Join-Path $env:TEMP "llama_temp.zip"
          Invoke-WebRequest -Uri $url -OutFile $tempZip
          New-Item -Path $destFolder -ItemType Directory -Force
          Expand-Archive -Path $tempZip -DestinationPath $destFolder -Force
          Remove-Item $tempZip
        }

        # Create directories
        $llamaCpuDir = "llama_cpu"
        $llamaCudaDir = "llama_cuda"
        $llamaVulkanDir = "llama_vulkan"
        New-Item -Path $llamaCpuDir, $llamaCudaDir, $llamaVulkanDir -ItemType Directory -Force

        # Download and extract files
        Download-Extract -url "https://github.com/azooKey/llama.cpp/releases/download/b4846/llama-b4846-bin-win-noavx-x64.zip" -destFolder $llamaCpuDir
        Download-Extract -url "https://github.com/azooKey/llama.cpp/releases/download/b4846/llama-b4846-bin-win-cuda-cu12.4-x64.zip" -destFolder $llamaCudaDir
        Download-Extract -url "https://github.com/azooKey/llama.cpp/releases/download/b4846/llama-b4846-bin-win-vulkan-x64.zip" -destFolder $llamaVulkanDir

        # Copy llama.lib to server-swift
        Copy-Item "$llamaCpuDir\llama.lib" -Destination "server-swift\" -Force

        # Download the zenz model
        $zenzUrl = "https://huggingface.co/Miwa-Keita/zenz-v3-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf"
        $zenzDest = "zenz.gguf"
        Invoke-WebRequest -Uri $zenzUrl -OutFile $zenzDest

    - name: Install node dependencies
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Check Rust before packaging
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build
      run: cargo make build --release

    - name: Verify
      run: pwsh -ExecutionPolicy Bypass -File scripts/verify-safe.ps1 -SkipClippy

    - name: Verify release package and real CPU converter
      shell: pwsh
      run: |
        pwsh -ExecutionPolicy Bypass -File scripts/verify-release.ps1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo build -p azookey-converter --example provider_fixture
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $env:Path = "$PWD/build/release;$PWD/build/release/llama_cpu;$env:Path"
        $env:AZOOKEY_TEST_RESOURCES = "$PWD/build/release"
        $env:AZOOKEY_TEST_ZENZAI = '1'
        cargo test -p azookey-server --bin azookey-server -- --nocapture
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Push-Location server-swift
        try {
          swift test -c release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally { Pop-Location }
        cargo test -p azookey-server --example engine_lifecycle -- --include-ignored --nocapture
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo run -p azookey-server --example engine_lifecycle
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $hash = (Get-FileHash build/azookey-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  azookey-setup.exe" | Set-Content build/azookey-setup.exe.sha256 -Encoding ascii

    - name: Upload Setup Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: azookey-setup
        path: |
          build/azookey-setup.exe
          build/azookey-setup.exe.sha256
        if-no-files-found: error

    - name: Save Swift build cache
      if: always() && !cancelled() && steps.swift-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: server-swift/.build
        key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  release:
    name: Publish installer version
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write # Create the prerelease and upload its verified installer assets.
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: azookey-setup
        path: release-assets
    - name: Publish verified installer version
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        # The installer version selects the tag and notes; bump it to publish a new prerelease.
        $match = Select-String -LiteralPath installer/Installer.iss -Pattern '^#define MyAppVersion "(\d+\.\d+\.\d+-alpha\.(\d+))"$'
        if (!$match) { throw 'Installer version must be a numbered alpha' }
        $version = $match.Matches[0].Groups[1].Value
        $tag = "v$version"
        $notes = "docs/releases/alpha$($match.Matches[0].Groups[2].Value).md"
        if (!(Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
        if ((Get-Content -LiteralPath frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version -ne $version) {
          throw 'Settings app version does not match the installer version'
        }
        $existing = & gh release list --limit 100 --json tagName,isDraft 2>&1
        if ($LASTEXITCODE -ne 0) { throw ($existing -join "`n") }
        $matching = @((($existing -join "`n") | ConvertFrom-Json) | Where-Object { $_.tagName -eq $tag })
        if ($matching.Count -gt 0 -and !$matching[0].isDraft) {
          Write-Host "$tag already exists; keeping the published release"
          exit 0
        }
        # Verify an existing tag before either creating a release or replacing draft assets.
        $tagRefs = & gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref' 2>&1
        if ($LASTEXITCODE -ne 0) { throw ($tagRefs -join "`n") }
        $hasTag = $tagRefs -contains "refs/tags/$tag"
        if ($hasTag -or $matching.Count -gt 0) {
          if ($hasTag) {
            # Resolve annotated tags to their commit as well as lightweight tags.
            $tagCommit = & gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq '.sha' 2>&1
          } else {
            # A draft created with --target may not have a Git tag until publication.
            $tagCommit = & gh release view $tag --json targetCommitish --jq '.targetCommitish' 2>&1
          }
          if ($LASTEXITCODE -ne 0) { throw ($tagCommit -join "`n") }
          if (($tagCommit -join "`n").Trim() -ne $env:GITHUB_SHA) {
            throw 'Release target and verified installer refer to different commits; refusing publication'
          }
        }
        if ($matching.Count -gt 0) {
          # A previous upload may have stopped halfway; repair both assets before publishing.
          gh release upload $tag release-assets/azookey-setup.exe release-assets/azookey-setup.exe.sha256 --clobber
        } else {
          gh release create $tag release-assets/azookey-setup.exe release-assets/azookey-setup.exe.sha256 --target $env:GITHUB_SHA --title $tag --notes-file $notes --prerelease --draft
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        gh release edit $tag --draft=false
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
