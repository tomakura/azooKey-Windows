# makefile for cargo
[config]
default_to_workspace = false

[tasks.format]
command = "cargo"
args = ["fmt"]

[tasks.build_swift]
description = "Build the swift converter"
script_runner = "powershell"
script_extension = "ps1"
script = """
$swiftBin = Join-Path $env:LOCALAPPDATA "Programs\\Swift\\Toolchains\\6.3.2+Asserts\\usr\\bin"
if ((Test-Path $swiftBin) -and -not (Get-Command swift -ErrorAction SilentlyContinue)) {
    $env:Path = "$swiftBin;$env:Path"
}
Push-Location server-swift
try {
    swift package resolve
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    & ../scripts/prepare-swift-dependency.ps1
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    swift build -c release
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
} finally {
    Pop-Location
}
"""

[tasks.build_x64]
command = "cargo"
args = ["build", "${@}"]

[tasks.build_x86]
command = "cargo"
args = ["build", "-p", "azookey-windows", "--target=i686-pc-windows-msvc", "${@}"]

[tasks.build_tauri]
description = "Build the settings UI"
script_runner = "powershell"
script_extension = "ps1"
script = """
$npmCli = "C:\\Program Files\\nodejs\\node_modules\\npm\\bin\\npm-cli.js"
Push-Location frontend
try {
    if (Test-Path $npmCli) {
        node $npmCli run tauri build -- --no-bundle
    } else {
        npm run tauri build -- --no-bundle
    }
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
} finally {
    Pop-Location
}
"""

[tasks.build_installer]
script_runner = "powershell"
script_extension = "ps1"
script = """
$compiler = Get-Command iscc -ErrorAction SilentlyContinue
if ($compiler) {
    & $compiler.Source installer/Installer.iss
} else {
    $compilerPath = @("C:\\Program Files\\Inno Setup 7\\ISCC.exe", "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe", "C:\\Program Files\\Inno Setup 6\\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
    if (!$compilerPath) { throw "Inno Setup compiler was not found" }
    & $compilerPath installer/Installer.iss
}
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""

[tasks.post_build]
description = "Stage a fresh package including the Swift runtime and resources"
script_runner = "powershell"
script_extension = "ps1"
script = """
$str = $args[0]
$configuration = if ($str -eq "--release") { "release" } else { "debug" }
& (Join-Path $env:CARGO_MAKE_WORKING_DIRECTORY "scripts/stage-release.ps1") -Configuration $configuration
"""
args = ["${@}"]

[tasks.grant_appcontainer_permissions]
description = "Grant AppContainer read and execute permissions to built IME DLLs"
script_runner = "powershell"
script_extension = "ps1"
script = """
icacls build/release/azookey_windows.dll /grant "*S-1-15-2-1:(RX)"
icacls build/release/x86/azookey_windows.dll /grant "*S-1-15-2-1:(RX)"
"""

[tasks.dev_reload]
description = "Hot-reload Azookey without system restart (run dev-reload.ps1)"
script_runner = "powershell"
script_extension = "ps1"
script = """
& (Join-Path $env:CARGO_MAKE_WORKING_DIRECTORY "dev-reload.ps1")
"""

[tasks.dev]
description = "Build x64 only and hot-reload (fast dev cycle, no installer needed)"
dependencies = ["build_swift", "build_x64", "dev_reload"]

[tasks.build]
clear = true
description = "Run the flow"
dependencies = [
    "format",
    "build_swift",
    "build_x64",
    "build_x86",
    "build_tauri",
    "post_build",
    "build_installer"
]
